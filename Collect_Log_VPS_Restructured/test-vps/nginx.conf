user  nginx;
worker_processes  1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format étendu « sophatel » : combined + xff + request_time + upstream_time
    # (reconnu par le parseur du collecteur, avec latence).
    log_format sophatel '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                        '"$http_x_forwarded_for" $request_time $upstream_response_time';

    access_log /var/log/nginx/access.log sophatel;

    server {
        listen 80;
        server_name _;
        location / { return 200 "ok\n"; }
    }
}
